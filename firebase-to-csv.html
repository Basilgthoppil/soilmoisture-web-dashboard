<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase to CSV Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
            display: none;
        }
        
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .status {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        
        .status-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
        
        .status-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .preview {
            margin-top: 20px;
            display: none;
        }
        
        .preview h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .preview-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #374151;
            white-space: pre-wrap;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .info-box p {
            color: #0c4a6e;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .info-box strong {
            color: #075985;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Soil Moisture Data Exporter</h1>
        <p class="subtitle">Convert Firebase data to CSV format</p>
        
        <div class="info-box">
            <p><strong>Your Firebase URL:</strong><br>
            https://soil-moisture-logging-default-rtdb.firebaseio.com/soil_logs.json</p>
        </div>
        
        <div class="input-group">
            <label for="firebaseUrl">Firebase Database URL</label>
            <input 
                type="text" 
                id="firebaseUrl" 
                placeholder="https://your-project.firebaseio.com/soil_logs.json"
                value="https://soil-moisture-logging-default-rtdb.firebaseio.com/soil_logs.json"
            >
        </div>
        
        <div id="status" class="status"></div>
        
        <button class="btn btn-primary" onclick="fetchAndConvert()">
            📊 Fetch & Convert to CSV
        </button>
        
        <button id="downloadBtn" class="btn btn-success" onclick="downloadCSV()">
            💾 Download CSV File
        </button>
        
        <div id="preview" class="preview">
            <h3>📄 Data Preview (first 10 rows)</h3>
            <div id="previewBox" class="preview-box"></div>
        </div>
    </div>

    <script>
        let csvData = '';
        let allData = [];

        async function fetchAndConvert() {
            const url = document.getElementById('firebaseUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            const preview = document.getElementById('preview');
            
            if (!url) {
                showStatus('Please enter a Firebase URL', 'error');
                return;
            }
            
            // Show loading
            showStatus('<div class="loader"></div>Fetching data from Firebase...', 'info');
            downloadBtn.style.display = 'none';
            preview.style.display = 'none';
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data || Object.keys(data).length === 0) {
                    showStatus('No data found in Firebase!', 'error');
                    return;
                }
                
                // Convert to array
                allData = [];
                for (let key in data) {
                    allData.push({
                        id: key,
                        moisture: data[key].moisture,
                        timestamp: data[key].timestamp
                    });
                }
                
                // Sort by timestamp
                allData.sort((a, b) => a.timestamp - b.timestamp);
                
                // Convert to CSV
                csvData = 'ID,Moisture (%),Timestamp (Unix),Date Time (IST)\n';
                
                allData.forEach(item => {
                    const date = new Date(item.timestamp);
                    const istDate = new Date(date.getTime() + (5.5 * 60 * 60 * 1000)); // IST offset
                    const dateStr = istDate.toLocaleString('en-IN', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                    
                    csvData += `${item.id},${item.moisture},${item.timestamp},"${dateStr}"\n`;
                });
                
                // Show preview (first 10 rows)
                const previewLines = csvData.split('\n').slice(0, 11).join('\n');
                document.getElementById('previewBox').textContent = previewLines;
                preview.style.display = 'block';
                
                showStatus(`✅ Successfully converted ${allData.length} records!`, 'success');
                downloadBtn.style.display = 'block';
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }
        
        function downloadCSV() {
            if (!csvData) {
                showStatus('No data to download!', 'error');
                return;
            }
            
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const now = new Date();
            const filename = `soil_moisture_${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}-${now.getMinutes().toString().padStart(2,'0')}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatus(`📥 Downloaded: ${filename}`, 'success');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status status-' + type;
            statusDiv.style.display = 'block';
        }
        
        // Allow Enter key to trigger conversion
        document.getElementById('firebaseUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchAndConvert();
            }
        });
    </script>
</body>
</html>
