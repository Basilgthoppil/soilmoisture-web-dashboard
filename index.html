<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Moisture Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .card-label {
            color: #999;
            font-size: 12px;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-good {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .data-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e5e7eb;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            color: #333;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Soil Moisture Dashboard</h1>
            <p class="subtitle">Real-time monitoring and data analysis</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <label for="firebaseUrl">Firebase Database URL</label>
                <input 
                    type="text" 
                    id="firebaseUrl" 
                    value="https://soil-moisture-logging-default-rtdb.firebaseio.com/soil_logs.json"
                    placeholder="https://your-project.firebaseio.com/soil_logs.json"
                >
            </div>
            
            <div class="input-group">
                <label for="refreshInterval">Auto Refresh Interval</label>
                <select id="refreshInterval">
                    <option value="0">Manual Only</option>
                    <option value="5000">5 seconds</option>
                    <option value="10000" selected>10 seconds</option>
                    <option value="30000">30 seconds</option>
                    <option value="60000">1 minute</option>
                </select>
            </div>
            
            <div id="alert" class="hidden"></div>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="loadData()">🔄 Load Data</button>
                <button class="btn btn-success" onclick="downloadCSV()" id="downloadBtn" disabled>💾 Download CSV</button>
            </div>
        </div>
        
        <div class="cards">
            <div class="card">
                <h3>Current Moisture</h3>
                <div class="card-value" id="currentMoisture">--</div>
                <div class="card-label">Last updated: <span id="lastUpdate">--</span></div>
                <div id="moistureStatus"></div>
            </div>
            
            <div class="card">
                <h3>Average (24h)</h3>
                <div class="card-value" id="avgMoisture">--</div>
                <div class="card-label">Based on recent readings</div>
            </div>
            
            <div class="card">
                <h3>Total Records</h3>
                <div class="card-value" id="totalRecords">--</div>
                <div class="card-label">All time data points</div>
            </div>
            
            <div class="card">
                <h3>Min / Max</h3>
                <div class="card-value" style="font-size: 24px;">
                    <span id="minMoisture">--</span> / <span id="maxMoisture">--</span>
                </div>
                <div class="card-label">Lowest and highest readings</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3 style="margin-bottom: 20px; color: #333;">📊 Moisture Over Time</h3>
            <canvas id="moistureChart"></canvas>
        </div>
        
        <div class="data-table">
            <h3 style="margin-bottom: 20px; color: #333;">📋 Recent Data (Last 50 readings)</h3>
            <div id="tableContainer">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let chart = null;
        let refreshTimer = null;
        let csvData = '';
        
        // Initialize chart
        const ctx = document.getElementById('moistureChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Moisture (%)',
                    data: [],
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: { size: 14 },
                        bodyFont: { size: 13 }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            }
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
        
        // Load data function
        async function loadData() {
            const url = document.getElementById('firebaseUrl').value.trim();
            
            if (!url) {
                showAlert('Please enter a Firebase URL', 'error');
                return;
            }
            
            showAlert('Loading data...', 'info');
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (!data || Object.keys(data).length === 0) {
                    showAlert('No data found in Firebase', 'error');
                    return;
                }
                
                // Convert to array
                allData = [];
                for (let key in data) {
                    allData.push({
                        id: key,
                        moisture: parseFloat(data[key].moisture),
                        timestamp: parseInt(data[key].timestamp)
                    });
                }
                
                // Sort by timestamp
                allData.sort((a, b) => a.timestamp - b.timestamp);
                
                // Update dashboard
                updateDashboard();
                updateChart();
                updateTable();
                prepareCSV();
                
                showAlert(`✅ Loaded ${allData.length} records successfully!`, 'success');
                document.getElementById('downloadBtn').disabled = false;
                
            } catch (error) {
                showAlert(`❌ Error: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }
        
        // Update dashboard cards
        function updateDashboard() {
            const latest = allData[allData.length - 1];
            const last24h = allData.filter(d => d.timestamp > Date.now() - 86400000);
            
            // Current moisture
            document.getElementById('currentMoisture').textContent = latest.moisture.toFixed(1) + '%';
            
            // Last update time
            const lastTime = new Date(latest.timestamp);
            document.getElementById('lastUpdate').textContent = lastTime.toLocaleString('en-IN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // Moisture status
            const statusDiv = document.getElementById('moistureStatus');
            if (latest.moisture < 20) {
                statusDiv.innerHTML = '<div class="status status-danger">⚠️ Needs Water</div>';
            } else if (latest.moisture < 40) {
                statusDiv.innerHTML = '<div class="status status-warning">💧 Low Moisture</div>';
            } else {
                statusDiv.innerHTML = '<div class="status status-good">✅ Good Moisture</div>';
            }
            
            // Average
            const avg = last24h.reduce((sum, d) => sum + d.moisture, 0) / last24h.length;
            document.getElementById('avgMoisture').textContent = avg.toFixed(1) + '%';
            
            // Total records
            document.getElementById('totalRecords').textContent = allData.length;
            
            // Min/Max
            const moistureValues = allData.map(d => d.moisture);
            const min = Math.min(...moistureValues);
            const max = Math.max(...moistureValues);
            document.getElementById('minMoisture').textContent = min.toFixed(1) + '%';
            document.getElementById('maxMoisture').textContent = max.toFixed(1) + '%';
        }
        
        // Update chart
        function updateChart() {
            // Show last 100 data points
            const chartData = allData.slice(-100);
            
            const labels = chartData.map(d => {
                const date = new Date(d.timestamp);
                return date.toLocaleString('en-IN', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            });
            
            const values = chartData.map(d => d.moisture);
            
            chart.data.labels = labels;
            chart.data.datasets[0].data = values;
            chart.update();
        }
        
        // Update table
        function updateTable() {
            const recentData = allData.slice(-50).reverse();
            
            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Moisture</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            recentData.forEach(item => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                const timeStr = date.toLocaleTimeString('en-IN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                let status = '';
                if (item.moisture < 20) {
                    status = '<span style="color: #dc2626;">⚠️ Low</span>';
                } else if (item.moisture < 40) {
                    status = '<span style="color: #f59e0b;">💧 Medium</span>';
                } else {
                    status = '<span style="color: #10b981;">✅ Good</span>';
                }
                
                tableHTML += `
                    <tr>
                        <td>${dateStr}</td>
                        <td>${timeStr}</td>
                        <td><strong>${item.moisture.toFixed(1)}%</strong></td>
                        <td>${status}</td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = tableHTML;
        }
        
        // Prepare CSV
        function prepareCSV() {
            csvData = 'ID,Moisture (%),Timestamp (Unix),Date,Time,Status\n';
            
            allData.forEach(item => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                const timeStr = date.toLocaleTimeString('en-IN', { hour12: false });
                
                let status = '';
                if (item.moisture < 20) status = 'Low';
                else if (item.moisture < 40) status = 'Medium';
                else status = 'Good';
                
                csvData += `${item.id},${item.moisture},${item.timestamp},"${dateStr}","${timeStr}",${status}\n`;
            });
        }
        
        // Download CSV
        function downloadCSV() {
            if (!csvData) {
                showAlert('No data to download!', 'error');
                return;
            }
            
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const now = new Date();
            const filename = `soil_moisture_${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}-${now.getMinutes().toString().padStart(2,'0')}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showAlert(`📥 Downloaded: ${filename}`, 'success');
        }
        
        // Show alert
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.classList.remove('hidden');
            
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('hidden');
                }, 5000);
            }
        }
        
        // Auto refresh
        document.getElementById('refreshInterval').addEventListener('change', function() {
            const interval = parseInt(this.value);
            
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            
            if (interval > 0) {
                refreshTimer = setInterval(() => {
                    loadData();
                }, interval);
                showAlert(`Auto-refresh enabled (every ${interval/1000}s)`, 'info');
            }
        });
        
        // Load data on startup
        window.addEventListener('load', function() {
            loadData();
            
            // Set default refresh (10 seconds)
            const interval = parseInt(document.getElementById('refreshInterval').value);
            if (interval > 0) {
                refreshTimer = setInterval(() => {
                    loadData();
                }, interval);
            }
        });
    </script>
</body>
</html>
